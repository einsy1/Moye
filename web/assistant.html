<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'"><title>墨页 · 文稿助手</title><link rel="stylesheet" href="assistant.css"></head><body>
<header class="masthead"><div class="emblem">✦</div><div><h1>文稿助手</h1><p>让表达，更进一步。</p></div><span class="badge">CODEX</span></header>
<main>
<section class="card connection"><span class="dot"></span><div><span class="eyebrow">AI 模型</span><strong id="model-label">跟随 Codex 配置</strong></div><button id="settings-toggle" class="subtle">设置</button></section>
<section id="settings" class="card" hidden><label>模型 ID<input id="model" placeholder="留空跟随 Codex 配置"></label><p class="hint">生成时显示服务实际返回的模型；可填写账号支持的模型 ID。</p><label>Codex 路径<input id="executable" placeholder="自动查找本机 Codex"></label></section>
<section class="card"><div class="section-title"><h2>整理文稿</h2><span id="scope" class="pill">当前选区 / 全文</span></div><div class="presets"><button data-prompt="统一 Markdown 标题、列表和段落格式，保留全部事实和数字。">格式整理</button><button data-prompt="润色表达，使语言自然清晰，保留原意、事实和数字。">文字润色</button><button data-prompt="整理为结构清晰的会议纪要，不补充未提供的事实。">会议纪要</button></div><textarea id="instruction" aria-label="整理要求" placeholder="告诉助手，你想如何调整这份文稿…">整理 Markdown 格式和段落，保留事实、数字和原意。</textarea><div class="context-line"><span>◎</span><span id="document-name">在墨页中选择文字，或直接处理全文</span></div></section>
<section class="card"><div class="section-title"><h2>参考资料 <span id="file-count">0</span></h2><button id="attach" class="subtle">＋ 添加文档</button></div><div id="files"><div class="empty-files">把背景材料，交给助手参考。<small>支持 PDF、Word、Markdown、TXT</small></div></div><p class="hint">资料先在本机提取正文，点击生成时随请求发送。扫描 PDF 需先 OCR。</p></section>
<div class="generate-row"><button id="generate" class="primary">✦ 生成修改建议</button><button id="cancel" class="secondary" disabled>停止</button></div>
<p id="status" role="status" class="status">准备就绪 · 应用前可先检查建议</p>
<section class="card result"><div class="section-title"><h2>修改预览</h2><div class="tabs"><button id="tab-after" class="selected">建议</button><button id="tab-before">原文</button></div></div><div id="result-empty" class="result-empty"><span>✧</span><strong>好文字，值得再打磨一次</strong><p>生成后，在这里对照原文与修改建议。</p></div><pre id="after" hidden></pre><pre id="before" hidden></pre><button id="apply" class="apply" disabled>应用到文稿 <span>↵</span></button><p class="hint center">支持撤销 · 自动保留修改前草稿</p></section>
<footer>墨页 AI <span>仅处理你选择的正文与参考资料</span></footer>
</main><script src="assistant.js"></script></body></html>
