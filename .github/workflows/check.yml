name: Moye checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: ./build.sh
      - run: npm test
      - run: npm run test:markdown
      - run: npm run test:bridge
      - run: npm run test:regressions
      - run: npm run test:assistant
      - run: npm run test:native
      - run: npm run test:titlebar
      - run: npm run test:startup
